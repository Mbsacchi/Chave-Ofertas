<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldKeyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldGlowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Golden Key Head Ring -->
  <circle cx="36" cy="40" r="26" stroke="url(#goldKeyGradient)" stroke-width="8" fill="none" filter="url(#goldGlow)"/>
  
  <!-- Inner Golden Key Core -->
  <circle cx="36" cy="40" r="12" fill="#F59E0B" opacity="0.3"/>
  <circle cx="36" cy="40" r="7" fill="#FDE68A"/>
  
  <!-- Modern Geometric Golden Key Shaft -->
  <path d="M55 46 L86 77" stroke="url(#goldKeyGradient)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Key Teeth / Bits -->
  <path d="M72 63 L80 55" stroke="url(#goldKeyGradient)" stroke-width="7" stroke-linecap="round"/>
  <path d="M81 72 L89 64" stroke="url(#goldKeyGradient)" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Sparkle / Star of Savings in Gold -->
  <path d="M36 20 L38 27 L45 29 L38 31 L36 38 L34 31 L27 29 L34 27 Z" fill="#FBBF24"/>
</svg>
